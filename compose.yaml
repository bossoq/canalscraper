name: canalscraper

services:
  canalscraper:
    image: ghcr.io/bossoq/canalscraper:latest
    pull_policy: always
    init: true
    restart: unless-stopped
    environment:
      # Compose reads ./.env automatically for this interpolation.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?set DISCORD_WEBHOOK_URL in .env}
      STATION_IDS: ${STATION_IDS:-162}
      HOURS: ${HOURS:-24}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-3600}
      TZ: ${TZ:-Asia/Bangkok}
      # Home Assistant. Unset MQTT_HOST skips the sensor, unset HA_URL/HA_TOKEN
      # skips the statistics import, and unsetting both skips the step entirely.
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASS: ${MQTT_PASS:-}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-canalscraper}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
